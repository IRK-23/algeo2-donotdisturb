# docker-compose.yml

version: '3.8'

services:
  # =========================================================================
  # 1. FRONTEND SERVICE (REACT/VITE)
  # =========================================================================
  frontend:
    container_name: library_frontend
    build: 
      context: ./client # Lokasi Dockerfile
      dockerfile: Dockerfile
    # Nama host yang bisa diakses oleh backend (digunakan untuk CORS)
    hostname: frontend 
    # Port mapping: host_port:container_port
    ports:
      - "80:80" 
    restart: always
    depends_on:
      - backend # Pastikan backend berjalan sebelum frontend
    # Catatan: Gunakan volume hanya jika Anda perlu live development di Docker

  # =========================================================================
  # 2. BACKEND SERVICE (PYTHON)
  # =========================================================================
  backend:
    container_name: library_backend
    build: 
      context: ./server # ⚠️ Anda perlu membuat folder 'server' dan Dockerfile-nya
      dockerfile: Dockerfile
    # Nama host yang bisa diakses oleh frontend (digunakan untuk API calls)
    hostname: backend 
    ports:
      - "5000:5000" # Mapping port 5000 untuk server Python Anda
    # Mapping volume (opsional, untuk development atau log)
    volumes:
      - ./server:/app # Mapping kode dari host ke container
    restart: always

# =========================================================================
# 3. JARINGAN
# =========================================================================
networks:
  default:
    name: library_network