version: '3.8'

services:
  # ============================ FRONTEND ============================
  frontend:
    container_name: library_frontend
    build:
      context: ./client
      dockerfile: Dockerfile
    hostname: frontend
    ports:
      - "80:80"        # Ngakses app: http://localhost/
    restart: always
    depends_on:
      - backend

  # ============================ BACKEND =============================
  backend:
    container_name: library_backend
    build:
      context: ./server
      dockerfile: Dockerfile
    hostname: backend
    ports:
      - "5000:5000"    # Ngakses API: http://localhost:5000
    volumes:
      - ./server:/app  # optional: supaya backend auto refresh saat edit
    restart: always

# ============================ NETWORK ==============================
networks:
  default:
    name: library_network
