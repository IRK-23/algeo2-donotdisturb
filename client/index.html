<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Library Search</title>
    <style>
        .item {
            display: inline-block;
            width: 140px;
            margin: 10px;
            border: 1px solid #ddd;
            padding: 10px;
            text-align: center;
            cursor: pointer;
        }

        #pagination button {
            margin: 5px;
        }
    </style>
</head>

<body>

<h2>Book Library</h2>

<!-- ===================== -->
<!-- SEARCH INPUT AREA -->
<!-- ===================== -->
<input id="q" placeholder="Search by title...">
<button id="btnSearch">Search</button>

<button id="btnImage">Search by Image</button>
<input type="file" id="imgInput" accept="image/*" hidden>

<button id="btnText">Search by Text</button>
<input type="file" id="txtInput" accept=".txt" hidden>

<button id="btnHome">Home</button>

<p id="status"></p>

<!-- RESULTS -->
<div id="results"></div>

<!-- PAGINATION -->
<div id="pagination"></div>

<!-- POPUP -->
<div id="popup" style="
    display:none;
    position:fixed;
    top:0; left:0;
    width:100%; height:100%;
    background:rgba(0,0,0,0.6);
    padding:40px;
    overflow:auto;
">
    <div id="popupContent" style="
        background:white;
        padding:20px;
        max-width:800px;
        margin:auto;
        border-radius:10px;
    "></div>
</div>

<!-- Load JS -->
<script src="app.js"></script>

</body>
</html>
